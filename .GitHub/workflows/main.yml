name: Send Daily Post to Telegram

on:
  schedule:
    # Время по Гринвичу (UTC). 
    # В Уфе сейчас +5 часов от UTC.
    # Чтобы пост приходил в 08:00 утра по Уфе, ставим 03:00 по Гринвичу.
    - cron: '0 3 * * *'
  workflow_dispatch: # Позволяет запускать бота вручную в любое время

jobs:
  send_post:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: pip install requests

    - name: Run script
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python script.py
